# PR のチェック：反束縛チェック・秘密ファイルチェック・単体テスト・スモークテスト（3機能を2人の視点で動かす）
name: チェック
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PLAYWRIGHT_VERSION: 1.64.1
  FIREBASE_TOOLS_VERSION: 15.32.1
  RULES_TESTING_VERSION: 5.0.2
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # 位置・既読・解析 SDK・ストリーク・管理者権限が入っていたら止める（scripts/release-check.mjs）
      # 公開リポジトリなので、署名鍵・サービスアカウントの鍵・google-services.json・.env が混ざっていても止める（tools/secret-check.mjs）
      - run: npm run check && npm run secret:check && npm test
      # Play リリースの下準備（versionCode・新機能の文・STORE.md の読み方）と、アプリに入れる www/ が作れるか
      - run: npm run play:test && npm run build
      # playwright は開発用にだけ使うので package.json には入れず、ここで入れる（版は固定）
      - run: npm i --no-save playwright@${{ env.PLAYWRIGHT_VERSION }} && npx playwright install --with-deps chromium
      - run: npm run smoke

  # Firestore のルール（2人だけ・誰がどの欄を書けるか）と、2つのブラウザで招待 → ペア → やり取り → 解消
  # どちらもエミュレータで動かすので、本物の Firebase にはつながない
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # SDK は js/firebase-config.js の FIREBASE_SDK と同じ版にそろえる
      - run: npm i --no-save firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} @firebase/rules-unit-testing@${{ env.RULES_TESTING_VERSION }} firebase@$(node -e "console.log(require('fs').readFileSync('js/firebase-config.js','utf8').match(/FIREBASE_SDK = '([^']+)'/)[1])") playwright@${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps chromium
      - run: npm run rules:test
      - run: npm run pair:test
